name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct_build:
    name: Build Android APK (Mobile + TV)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      # Generate the Android native project once. Do NOT use `yarn build` which re-runs prebuild.
      - name: Expo Prebuild
        run: EXPO_TV=1 EXPO_USE_METRO_WORKSPACE_ROOT=1 npx expo prebuild --clean --non-interactive
        env:
          EXPO_TV: "1"
          EXPO_USE_METRO_WORKSPACE_ROOT: "1"

      # Copy TV-specific XML configs (equivalent to yarn copy-config)
      - name: Copy TV XML configs
        run: cp -r xml/* android/app/src/

      # Fix: expo-modules-core (Expo SDK 51) accesses `components.release` inside afterEvaluate,
      # but in AGP 8.x the release SoftwareComponent is registered lazily and not available yet.
      # Patch: wrap the `from components.release` line with a null guard so the block is skipped
      # when the component isn't available (the app never publishes to Maven, so this is safe).
      - name: Patch ExpoModulesCorePlugin.gradle for AGP 8.x compatibility
        run: |
          node -e "
          const fs = require('fs');
          const filePath = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle';
          let content = fs.readFileSync(filePath, 'utf8');
          const original = 'from components.release';
          if (content.includes(original)) {
            content = content.replace(
              original,
              '// from components.release - patched: use findByName to avoid MissingPropertyException with AGP 8.x\n            def releaseComp = components.findByName(\"release\")\n            if (releaseComp != null) from releaseComp'
            );
            fs.writeFileSync(filePath, content);
            console.log('SUCCESS: Patched ExpoModulesCorePlugin.gradle');
          } else {
            console.log('NOTE: Pattern not found - file may already be patched or has different content');
          }
          "

      # Verify the patch
      - name: Verify patch applied
        run: grep -n "releaseComp\|from components.release" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || echo "WARNING: patch verification failed"

      # Build release APK directly via gradlew
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          NODE_ENV: production
          EXPO_TV: "1"

      - name: Rename APK file
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body: |
            **OrionTV v${{ steps.package-version.outputs.version }}**

            ### 本次更新内容
            - 📱 手机端自动横屏：进入播放页面自动锁定横屏，退出恢复竖屏
            - 🎬 全屏修复：视频铺满全屏，无上下黑边
            - ⏩ 倍速播放：手机端支持 0.5x ~ 2x 速度调节
            - 🥽 VR SBS 模式：点击眼镜图标开启左右分屏，兼容 VR 眼镜盒子
          draft: false
          prerelease: false
          files: artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
