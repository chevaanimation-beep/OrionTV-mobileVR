name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct_build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      # yarn.lock is the source of truth (package-lock.json has been removed)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      # Single expo prebuild — do NOT call `yarn build` which re-runs prebuild internally
      - name: Expo Prebuild
        run: EXPO_TV=1 EXPO_USE_METRO_WORKSPACE_ROOT=1 npx expo prebuild --clean --non-interactive
        env:
          EXPO_TV: "1"
          EXPO_USE_METRO_WORKSPACE_ROOT: "1"

      # Copy TV-specific XML resource configs (equivalent to yarn copy-config)
      - name: Copy TV XML configs
        run: cp -r xml/* android/app/src/

      # Fix: expo (Expo SDK 51) calls useExpoPublishing() in android/build.gradle, which
      # accesses `components.release` inside afterEvaluate. With AGP 8.x, the `release`
      # SoftwareComponent is registered lazily and is not available yet, causing:
      #   MissingPropertyException: Could not get unknown property 'release'
      # Fix: replace with components.findByName("release") null-guard.
      # This is safe — the app never publishes to Maven; this block only matters for library modules.
      - name: Patch ExpoModulesCorePlugin.gradle (fix AGP 8.x components.release)
        run: |
          node << 'EOF'
          const fs = require('fs');
          const filePath = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle';
          let content = fs.readFileSync(filePath, 'utf8');
          const original = 'from components.release';
          if (content.includes(original)) {
            const patched = [
              '// PATCHED for AGP 8.x compatibility: components.release is lazy and may not exist yet',
              '            def releaseComp = components.findByName("release")',
              '            if (releaseComp != null) from releaseComp',
            ].join('\n');
            content = content.replace(original, patched);
            fs.writeFileSync(filePath, content);
            console.log('SUCCESS: patched ExpoModulesCorePlugin.gradle');
          } else {
            console.log('SKIP: pattern not found (may already be patched)');
          }
          EOF

      - name: Verify patch
        run: grep -n "releaseComp" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      # Build release APK — bundles the JavaScript so it can run standalone without Metro
      # Output: android/app/build/outputs/apk/release/app-release.apk
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_TV: "1"

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body: |
            **OrionTV v${{ steps.package-version.outputs.version }}**

            ### 本次更新内容
            - 📱 手机端自动横屏：进入播放页面自动锁定横屏，退出恢复竖屏
            - 🎬 全屏修复：视频铺满全屏，无上下黑边
            - ⏩ 倍速播放：手机端支持 0.5x ~ 2x 速度调节
            - 🥽 VR SBS 模式：点击眼镜图标开启左右分屏，兼容 VR 眼镜盒子

            > 注意：这是 Debug 版本 APK，仅供测试用途。
          draft: false
          prerelease: false
          files: artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
