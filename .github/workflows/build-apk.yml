name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct_build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      # yarn.lock is the source of truth (package-lock.json has been removed)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      # Single expo prebuild — do NOT call `yarn build` which re-runs prebuild internally
      - name: Expo Prebuild
        run: EXPO_TV=1 EXPO_USE_METRO_WORKSPACE_ROOT=1 npx expo prebuild --clean --non-interactive
        env:
          EXPO_TV: "1"
          EXPO_USE_METRO_WORKSPACE_ROOT: "1"

      # Copy TV-specific XML resource configs (equivalent to yarn copy-config)
      - name: Copy TV XML configs
        run: cp -r xml/* android/app/src/

      # Copy native VR SBS module into the generated android project
      - name: Copy native VR module
        run: |
          mkdir -p android/app/src/main/java/com/oriontv/vr
          cp native/android/com/oriontv/vr/*.kt android/app/src/main/java/com/oriontv/vr/
          echo "--- Copied VR module files ---"
          ls -la android/app/src/main/java/com/oriontv/vr/

      # Register VRPlayerPackage in MainApplication so React Native finds <NativeVRPlayer>
      - name: Register VR native module in MainApplication
        run: |
          node << 'REGEOF'
          const fs = require('fs');
          const mainAppPath = 'android/app/src/main/java/com/oriontv/MainApplication.kt';
          let content = fs.readFileSync(mainAppPath, 'utf8');

          // Add import
          if (!content.includes('com.oriontv.vr.VRPlayerPackage')) {
            content = content.replace(
              'import android.app.Application',
              'import android.app.Application\nimport com.oriontv.vr.VRPlayerPackage'
            );

            // Add to packages list
            content = content.replace(
              /override fun getPackages\(\): List<ReactPackage> \{[\s\S]*?return PackageList\(this\)\.packages/,
              (match) => match + '.apply { add(VRPlayerPackage()) }'
            );

            fs.writeFileSync(mainAppPath, content);
            console.log('SUCCESS: Registered VRPlayerPackage in MainApplication');
          } else {
            console.log('SKIP: VRPlayerPackage already registered');
          }
          REGEOF

      # Add ExoPlayer (media3) dependency — needed by VRPlayerView for video decoding
      - name: Add media3-exoplayer dependency
        run: |
          node << 'DEPEOF'
          const fs = require('fs');
          const gradlePath = 'android/app/build.gradle';
          let content = fs.readFileSync(gradlePath, 'utf8');
          if (!content.includes('media3-exoplayer') || !content.includes('nanohttpd')) {
            content = content.replace(
              /dependencies\s*\{/,
              'dependencies {\n    implementation "androidx.media3:media3-exoplayer:1.3.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"\n    implementation "androidx.media3:media3-exoplayer-dash:1.3.1"\n    implementation "androidx.media3:media3-datasource:1.3.1"\n    implementation "org.nanohttpd:nanohttpd:2.3.1"'
            );
            fs.writeFileSync(gradlePath, content);
            console.log('SUCCESS: Added media3 and nanohttpd dependencies');
          } else {
            console.log('SKIP: dependencies already present');
          }
          DEPEOF

      # Patch ExpoModulesCorePlugin.gradle (fix AGP 8.x components.release)
      - name: Patch ExpoModulesCorePlugin.gradle
        run: |
          node << 'EOF'
          const fs = require('fs');
          const filePath = 'node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle';
          let content = fs.readFileSync(filePath, 'utf8');
          const original = 'from components.release';
          if (content.includes(original)) {
            const patched = [
              '// PATCHED for AGP 8.x compatibility',
              '            def releaseComp = components.findByName("release")',
              '            if (releaseComp != null) from releaseComp',
            ].join('\n');
            content = content.replace(original, patched);
            fs.writeFileSync(filePath, content);
            console.log('SUCCESS: patched ExpoModulesCorePlugin.gradle');
          } else {
            console.log('SKIP: pattern not found (may already be patched)');
          }
          EOF

      - name: Verify patches
        run: |
          echo "--- VR module files ---"
          ls android/app/src/main/java/com/oriontv/vr/
          echo "--- MainApplication VRPlayerPackage ---"
          grep -n "VRPlayerPackage" android/app/src/main/java/com/oriontv/MainApplication.kt || echo "WARNING: not found"
          echo "--- media3 dependency ---"
          grep -n "media3" android/app/build.gradle || echo "WARNING: not found"
          echo "--- ExpoModulesCorePlugin patch ---"
          grep -n "releaseComp" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle || echo "WARNING: not found"

      # Build release APK — bundles the JavaScript so it can run standalone without Metro
      # Output: android/app/build/outputs/apk/release/app-release.apk
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_TV: "1"

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body: |
            **OrionTV v${{ steps.package-version.outputs.version }}**

            ### 🔧 调试版 - 离线播放修复
            - **🐛 修复 M3U8 加密 key 路径 bug**：下载的 m3u8 manifest 中 EXT-X-KEY URI 改为绝对路径，解决 ExoPlayer 通过 local HTTP server 请求 key 文件时路径解析错误导致播放失败的问题
            - **🔍 详细调试日志（LocalServerModule）**：每次 HTTP 请求均打印 URI、文件路径、是否存在、文件大小，404 时列出父目录内容，方便 logcat 排查
            - **🔍 详细调试日志（play.tsx）**：打印 localPath 原始值、cleanPath、最终 proxyUrl，覆盖路径处理每一步
            - **🛠️ 路径处理改进**：使用 `slice('file://'.length)` 替代 `replace('file://', '')`，避免路径中包含 file:// 字样被误替换

            > 安装后请重新下载一剧集（旧缓存的 key 路径格式有误），然后用 logcat 过滤 `LocalServerModule` 和 `PlayScreen` 查看日志。
          draft: false
          prerelease: false
          files: artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
